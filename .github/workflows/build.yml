name: Build

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

  workflow_dispatch:

permissions: read-all

jobs:
  ci:
    permissions:
      contents: read
      id-token: write
    # Reusable CI lives in 1set/meta — the single source of truth for every
    # Star* module's pipeline. Pinned to a commit SHA for supply-chain safety;
    # bump the pin when meta's workflow changes (Dependabot github-actions can
    # automate this).
    uses: 1set/meta/.github/workflows/go-ci.yml@496f38088eff1a37bae1b43d158146a8a9d83a37
    with:
      # gum is the ecosystem's go-1.25 exception: charm.land/huh/v2 and
      # glamour/v2 declare `go 1.25.8`, so the v2 migration forces the floor to
      # 1.25 (it coincides with the latest-stable leg — there is no version in
      # between to test, which is expected for this repo only).
      go-floor: "1.25"
      doc-coverage: true
      doc-coverage-file: docs/API.md
      doc-coverage-config: true
      cov-min: 64
      footprint: true
      footprint-max-mb: 26
    secrets: inherit

  # Backfill real coverage for a pre-OIDC commit; do not substitute head data.
  baseline:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: b6aec2454fef34d0a9396dc90976edb7d680ae3d
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
      - run: go test -race -coverprofile=coverage-baseline.txt ./...
      - uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage-baseline.txt
          disable_search: true
          fail_ci_if_error: true
          override_commit: b6aec2454fef34d0a9396dc90976edb7d680ae3d
          override_branch: master
